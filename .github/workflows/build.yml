name: Build Chroma Comp

on:
  push:
    branches: [main, master]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: Windows, os: windows-latest }
          - { name: macOS,   os: macos-latest }
          - { name: Linux,   os: ubuntu-latest }

    steps:
      - uses: actions/checkout@v4

      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          # package list from JUCE's own "Linux Dependencies" page (it includes libxi-dev, which this workflow was missing)
          sudo apt-get install -y libasound2-dev libfreetype-dev libfontconfig1-dev \
            libx11-dev libxcomposite-dev libxcursor-dev libxext-dev libxinerama-dev \
            libxrandr-dev libxrender-dev libxi-dev \
            libgl1-mesa-dev libglu1-mesa-dev mesa-common-dev libegl-dev \
            libcurl4-openssl-dev ladspa-sdk

      - name: Configure
        shell: bash
        run: cmake -B build -DCMAKE_BUILD_TYPE=Release

      - name: Build
        run: cmake --build build --config Release --parallel

      - name: Upload plugin
        uses: actions/upload-artifact@v4
        with:
          name: ChromaComp-${{ matrix.name }}
          if-no-files-found: error
          path: |
            build/ChromaComp_artefacts/Release/VST3
            build/ChromaComp_artefacts/Release/AU
            build/ChromaComp_artefacts/Release/Standalone

  installer-windows:
    name: Windows installer
    needs: build
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: ChromaComp-Windows
          path: payload
      - name: Install Inno Setup
        shell: pwsh
        run: choco install innosetup -y --no-progress
      - name: Build installer
        shell: pwsh
        run: |
          Get-ChildItem -Recurse payload | Select-Object -First 20 FullName
          & "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe" installer\ChromaComp.iss
      - uses: actions/upload-artifact@v4
        with:
          name: ChromaComp-Windows-Installer
          if-no-files-found: error
          path: installer/Output/ChromaComp-Setup.exe

  release:
    name: Publish release
    needs: [build, installer-windows]
    if: ${{ ! cancelled() && needs.build.result == 'success' && startsWith(github.ref, 'refs/tags/v') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
      - name: Zip each platform
        run: |
          cd dist
          for d in */; do (cd "$d" && zip -qr "../${d%/}.zip" .); done
      - uses: softprops/action-gh-release@v2
        with:
          files: dist/*.zip
          generate_release_notes: true
